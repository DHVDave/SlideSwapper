<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; }
  section {
    width: 1920px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
  }
  .slide-1 { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
  .slide-2 { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
  .slide-3 { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; }
  h1 { font-size: 72px; margin-bottom: 24px; }
  p { font-size: 36px; opacity: 0.9; }
</style>
</head>
<body>
  <section class="slide-1">
    <h1>Welcome to SlideSwapper</h1>
    <p>HTML presentations, converted to PowerPoint</p>
  </section>
  <section class="slide-2">
    <h1>How It Works</h1>
    <p>Screenshot each slide, assemble into .pptx</p>
  </section>
  <section class="slide-3">
    <h1>Thank You!</h1>
    <p>Simple, fast, pixel-perfect</p>
  </section>
</body>
</html>
